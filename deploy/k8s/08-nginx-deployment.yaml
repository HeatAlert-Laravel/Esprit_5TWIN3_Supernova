apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: heatalert
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: heatalert
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/part-of: heatalert
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: heatalert-single-node
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: aymen74407/heatalert-nginx:REPLACE_WITH_FULL_GIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: public-files
              mountPath: /var/www/html/public/storage
              readOnly: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: public-files
          persistentVolumeClaim:
            claimName: public-files
