apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: heatalert
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: heatalert
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30088
      protocol: TCP
