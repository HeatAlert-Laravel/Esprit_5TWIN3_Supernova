apiVersion: v1
kind: PersistentVolume
metadata:
  name: heatalert-logs-pv
  labels:
    heatalert.io/volume: logs
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: heatalert-local
  local:
    path: /srv/heatalert-k8s/app-logs
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [heatalert-single-node]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-logs
  namespace: heatalert
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: heatalert-local
  selector:
    matchLabels:
      heatalert.io/volume: logs
  resources:
    requests:
      storage: 1Gi
