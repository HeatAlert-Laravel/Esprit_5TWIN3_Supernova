name: heatalert
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: heatalert
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  app:
    image: ${DOCKERHUB_NAMESPACE:?Set DOCKERHUB_NAMESPACE}/heatalert-app:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:?Set PRODUCTION_ENV_FILE}
    environment:
      MYSQL_ROOT_PASSWORD: ""
    depends_on:
      mysql: {condition: service_healthy}
    volumes:
      - public-files:/var/www/html/storage/app/public
      - private-files:/var/www/html/storage/app/private
      - app-logs:/var/www/html/storage/logs
      - app-cache:/var/www/html/storage/framework/cache
      - app-views:/var/www/html/storage/framework/views
    networks: [internal]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  nginx:
    image: ${DOCKERHUB_NAMESPACE:?Set DOCKERHUB_NAMESPACE}/heatalert-nginx:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    depends_on: [app]
    ports: ["${HTTP_PORT:-8088}:80"]
    volumes:
      - public-files:/var/www/html/public/storage:ro
    networks: [internal]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
networks:
  internal: {}
volumes:
  mysql-data: {}
  public-files: {}
  private-files: {}
  app-logs: {}
  app-cache: {}
  app-views: {}
